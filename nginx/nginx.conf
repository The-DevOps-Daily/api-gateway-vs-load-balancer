# Plain nginx as an L7 load balancer, with the same features turned on route by
# route: /plain (proxy only), /auth (+ API key), /ratelimit (+ per-key limit),
# /transform (+ header rewrite). One worker, pinned to one core by compose.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 8192;
}

http {
    access_log off;
    server_tokens off;

    upstream backend {
        server 127.0.0.1:9000;
        keepalive 256;
    }

    # A static key list. This is the whole "auth" feature here: no consumers,
    # no admin API, a reload to change it.
    map $http_apikey $key_ok {
        default        0;
        "bench-key-1"  1;
    }

    # Per-key limits. The bench limit is far above the test rate, so the run
    # measures the bookkeeping cost, never a refusal.
    limit_req_zone $http_apikey zone=bench:10m rate=100000r/s;
    limit_req_zone $http_apikey zone=check:1m rate=10r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    server {
        listen 127.0.0.1:8080 reuseport backlog=16384;
        location / {
            proxy_pass http://backend;
        }
    }

    server {
        listen 127.0.0.1:8443 ssl reuseport backlog=16384;
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.3;

        location /plain {
            proxy_pass http://backend;
        }

        location /auth {
            if ($key_ok = 0) { return 401; }
            proxy_set_header apikey "";
            # A proxy_set_header here drops the inherited ones, so repeat them.
            # Before nginx 1.29.7, losing Connection "" meant a new upstream
            # connection per request (see scripts/break-keepalive-1.28.sh).
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://backend;
        }

        location /ratelimit {
            if ($key_ok = 0) { return 401; }
            limit_req zone=bench burst=2000 nodelay;
            proxy_set_header apikey "";
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://backend;
        }

        location /transform {
            if ($key_ok = 0) { return 401; }
            limit_req zone=bench burst=2000 nodelay;
            proxy_set_header apikey "";
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Tag "gw-bench";
            proxy_hide_header X-Internal-Debug;
            add_header X-Gateway "nginx" always;
            proxy_pass http://backend;
        }

        # Only used by verify.sh: a low limit that must refuse a burst.
        location /rlcheck {
            if ($key_ok = 0) { return 401; }
            limit_req zone=check;
            proxy_set_header apikey "";
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://backend;
        }
    }
}
