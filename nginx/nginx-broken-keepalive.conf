# The break: nginx.conf with one mistake. In every location that sets its own
# proxy_set_header, the inherited Connection "" and Host lines are missing.
# Before nginx 1.29.7 that made nginx send "Connection: close" upstream and open
# a new backend connection for every request, while every response stayed
# correct. From 1.29.7 on, nginx sends no Connection header by default, so on
# 1.30 this config keeps its connections.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 8192;
}

http {
    access_log off;
    server_tokens off;

    upstream backend {
        server 127.0.0.1:9000;
        keepalive 256;
    }

    # A static key list. This is the whole "auth" feature here: no consumers,
    # no admin API, a reload to change it.
    map $http_apikey $key_ok {
        default        0;
        "bench-key-1"  1;
    }

    # Per-key limits. The bench limit is far above the test rate, so the run
    # measures the bookkeeping cost, never a refusal.
    limit_req_zone $http_apikey zone=bench:10m rate=100000r/s;
    limit_req_zone $http_apikey zone=check:1m rate=10r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    server {
        listen 127.0.0.1:8090 reuseport backlog=16384;
        location / {
            proxy_pass http://backend;
        }
    }

    server {
        listen 127.0.0.1:8453 ssl reuseport backlog=16384;
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.3;

        location /plain {
            proxy_pass http://backend;
        }

        location /auth {
            if ($key_ok = 0) { return 401; }
            proxy_set_header apikey "";
            proxy_pass http://backend;
        }

        location /ratelimit {
            if ($key_ok = 0) { return 401; }
            limit_req zone=bench burst=2000 nodelay;
            proxy_set_header apikey "";
            proxy_pass http://backend;
        }

        location /transform {
            if ($key_ok = 0) { return 401; }
            limit_req zone=bench burst=2000 nodelay;
            proxy_set_header apikey "";
            proxy_set_header X-Request-Tag "gw-bench";
            proxy_hide_header X-Internal-Debug;
            add_header X-Gateway "nginx" always;
            proxy_pass http://backend;
        }

        # Only used by verify.sh: a low limit that must refuse a burst.
        location /rlcheck {
            if ($key_ok = 0) { return 401; }
            limit_req zone=check;
            proxy_set_header apikey "";
            proxy_pass http://backend;
        }
    }
}
