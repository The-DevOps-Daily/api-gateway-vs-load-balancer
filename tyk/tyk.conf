{
  "listen_address": "127.0.0.1",
  "listen_port": 28080,
  "secret": "set-TYK_GW_SECRET-in-.env",
  "template_path": "/opt/tyk-gateway/templates",
  "app_path": "/opt/tyk-gateway/apps",
  "use_db_app_configs": false,
  "disable_ports_whitelist": true,
  "storage": {
    "type": "redis",
    "host": "127.0.0.1",
    "port": 6379,
    "optimisation_max_idle": 2000,
    "optimisation_max_active": 4000
  },
  "policies": { "policy_source": "file", "policy_path": "/opt/tyk-gateway/policies" },
  "hash_keys": true,
  "enable_analytics": false,
  "enable_jsvm": false,
  "health_check": { "enable_health_checks": false },
  "max_idle_connections_per_host": 256,
  "proxy_default_timeout": 30,
  "http_server_options": {
    "enable_http2": false,
    "min_version": 772,
    "ssl_certificates": ["/certs/server.pem"]
  },
  "log_level": "warn"
}
