# Only for scripts/explain-kong-timer.sh: Kong with its rate-limiting handler
# patched to count inline instead of in a timer per request.
services:
  kong-inline:
    profiles: [explain]
    ulimits: { nofile: 65536 }
    image: kong:3.9.5
    network_mode: host
    cpuset: "1"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_NGINX_EVENTS_WORKER_CONNECTIONS: "8192"
      KONG_PROXY_LISTEN: "127.0.0.1:18100 reuseport backlog=16384, 127.0.0.1:18543 ssl reuseport backlog=16384"
      KONG_ADMIN_LISTEN: "127.0.0.1:18101"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_STATUS_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_SSL_CERT: /certs/server.crt
      KONG_SSL_CERT_KEY: /certs/server.key
      KONG_SSL_CIPHER_SUITE: modern
      KONG_ANONYMOUS_REPORTS: "off"
      KONG_LOG_LEVEL: warn
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - ./certs:/certs:ro
      - ./kong/patched/handler.lua:/usr/local/share/lua/5.1/kong/plugins/rate-limiting/handler.lua:ro
